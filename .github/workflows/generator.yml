name: Download Datasource and generate embeddings

on: 
  workflow_dispatch:
    inputs:
      jsonData:
        required: true
        type: string

jobs:
  download-and-gen-embeddings:
    runs-on: ubuntu-latest
    steps:  
      - name: "Checking out the repo"
        uses: actions/checkout@v4 

      - name: "Installing bun"
        uses: oven-sh/setup-bun@v2

      - name: "Setup embedder"
        run: | 
          cd embedder
          bun i 
          bun run setup

      - name: "Pipeline" 
        env:
          jsonData: ${{inputs.jsonData}}
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          DATABASE_AUTH_TOKEN: ${{secrets.DATABASE_AUTH_TOKEN}}
        run: |
          echo "Running the script"
          bun run embedder/index.ts "$jsonData"
